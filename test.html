<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Booking 7-inch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      body {
        font-family: "Prompt", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col p-3"
  >
    <header
      class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3"
    >
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">ROOM 01</h1>
        <p class="text-xs text-slate-400">Conference Room</p>
      </div>
      <div class="text-right">
        <div id="live-clock" class="text-2xl font-bold text-indigo-400">
          00:00:00
        </div>
      </div>
    </header>

    <main class="flex-1 flex gap-3 min-h-0">
      <section class="w-8/12 flex flex-col gap-3">
        <div
          class="bg-red-950/30 border border-red-500/40 rounded-xl p-4 flex flex-col justify-between flex-1 relative overflow-hidden"
        >
          <div class="absolute top-0 left-0 w-1.5 h-full bg-red-500"></div>
          <div>
            <div
              class="inline-flex items-center gap-1.5 bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full text-xs font-semibold mb-2"
            >
              <span
                class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"
              ></span>
              BUSY
            </div>
            <h2 class="text-2xl font-bold text-white line-clamp-1">
              Marketing Meeting
            </h2>
            <p class="text-sm text-slate-300 font-medium mt-0.5">
              13:00 - 15:00 น.
            </p>
          </div>

          <div class="mt-2">
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div class="bg-red-500 h-full" style="width: 70%"></div>
            </div>
            <div class="flex justify-between text-[10px] text-slate-400 mt-1">
              <span>เริ่มแล้ว 65 นาที</span>
              <span class="text-red-400">เหลืออีก 25 นาที</span>
            </div>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
          <p
            class="text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-1.5"
          >
            NEXT (คิวถัดไป)
          </p>
          <div
            class="flex justify-between items-center bg-slate-800/60 p-2 rounded-lg border border-slate-700/30"
          >
            <div class="min-w-0">
              <p class="text-xs font-semibold text-white truncate">
                Dev Sprint Planning
              </p>
              <p class="text-[10px] text-slate-400 truncate">
                โดย Born Techasit
              </p>
            </div>
            <span
              class="bg-slate-700 text-indigo-300 text-[11px] px-2 py-0.5 rounded font-medium shrink-0 ml-2"
              >15:30</span
            >
          </div>
        </div>
      </section>

      <section class="w-4/12 flex flex-col">
        <div
          class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col items-center justify-center text-center h-full"
        >
          <p class="text-xs font-bold text-white mb-2">สแกนเพื่อจอง</p>

          <div class="bg-white p-2 rounded-lg inline-block" id="qrcode"></div>

          <p class="text-[9px] text-slate-400 mt-2 leading-tight"></p>
        </div>
      </section>
    </main>
  </body>
</html>
